name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          echo "Detected Java major version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java version must be 17 or newer, found: $JAVA_VER"
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f ./debug.keystore.base64 ]; then
            echo "Restoring permanent debug.keystore from debug.keystore.base64..."
            base64 -d ./debug.keystore.base64 > ./debug.keystore
          elif [ ! -f ./debug.keystore ]; then
            echo "debug.keystore not found. Generating temporary keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi

          if [ ! -f ./debug.keystore ]; then
            echo "Error: Failed to create or find debug.keystore."
            exit 1
          fi
          echo "debug.keystore verified successfully."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify generated APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK file not found at $APK_PATH"
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file at $APK_PATH is empty."
            exit 1
          fi
          echo "Verified APK at $APK_PATH with size $(stat -c%s "$APK_PATH") bytes."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prep_asset
        run: |
          mkdir -p /tmp/apk-release
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/apk-release/app-debug.apk
          echo "asset_path=/tmp/apk-release/app-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          gh release create "$TAG_NAME" \
            "${{ steps.prep_asset.outputs.asset_path }}" \
            --title "$RELEASE_TITLE" \
            --notes "Automated build of Debug APK from commit ${{ github.sha }}." \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
          echo "### APK Build and Release Summary" >> "$GITHUB_STEP_SUMMARY"
          if gh release view --latest >/dev/null 2>&1; then
            echo "Release created successfully."
            echo "Direct APK Download URL: $DOWNLOAD_URL"
            echo "Direct APK Download URL: [Download app-debug.apk]($DOWNLOAD_URL)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Warning: GitHub Release could not be created or accessed. The APK is still safely available in the Actions artifacts."
            echo "Check Actions artifacts tab for app-debug-apk." >> "$GITHUB_STEP_SUMMARY"
          fi
